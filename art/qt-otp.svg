<title>A cute cartoon grey kitten peeking over the top of the OTP vault shield icon</title>
<desc>A round, grey tabby cartoon kitten with pointed ears and whiskers peeks over the top edge of a green shield-and-padlock badge, paws hooked over the edge in front of the badge, smiling. Transparent background, cropped tightly.</desc>

