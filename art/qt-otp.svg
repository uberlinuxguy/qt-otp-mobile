       ic_vault_mark.xml         - faithful copy, used in-app
       ic_launcher_foreground.xml - badge dropped, shield enlarged and
                                    simplified so it survives a 48dp render
       ic_launcher_monochrome.xml - shield and padlock only, for themed icons
     Keep them in step when this changes. -->

