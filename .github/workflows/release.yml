name: Release

on:
  push:
    tags: ['v*']
  # Lets the signing path be dry-run without cutting a tag: the APK is built,
  # signed and uploaded as a run artifact, but no GitHub Release is published.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # A release that fails the vault interop tests would be a release that
      # cannot open a desktop vault, so this gates the build.
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      # Decoded outside the workspace so no artifact glob can reach it.
      # Decoded outside the workspace so no artifact glob can reach it.
      - name: Decode and check the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set - add the signing secrets to this repository"
              exit 1
            fi
          done

          # Keep only base64 characters. Whatever shell set the secret may have
          # wrapped the value, appended a newline, or led with a byte-order
          # mark, and base64 -d rejects all three with the same opaque
          # "invalid input".
          keystore="$RUNNER_TEMP/release.keystore"
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$keystore"; then
            echo "::error::KEYSTORE_BASE64 is not valid base64 - re-set it from the keystore file"
            exit 1
          fi
          echo "Decoded $(stat -c%s "$keystore") bytes"

          # Fail here rather than three minutes later inside Gradle, and
          # distinguish a corrupt file from a wrong password or wrong alias.
          if ! keytool -list -storetype PKCS12 -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS"; then
            echo "::error::The keystore did not open - check KEYSTORE_PASSWORD and that KEY_ALIAS exists in it"
            exit 1
          fi

      - name: Build the signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew :app:assembleRelease

      # Proves the APK is actually signed with the expected key, rather than
      # trusting that a green build means signed - an unsigned release APK
      # builds perfectly happily.
      - name: Verify the signature and name the APK
        run: |
          set -euo pipefail
          built=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$built" ]; then
            echo "::error::$built is missing - the release variant built unsigned"
            ls -l app/build/outputs/apk/release/ || true
            exit 1
          fi
          "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/37.0.0/apksigner" verify --print-certs --verbose "$built"

          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          ref="${GITHUB_REF_NAME}"
          case "$GITHUB_REF" in
            refs/tags/*) name="qt-otp-mobile-${ref}.apk" ;;
            *)           name="qt-otp-mobile-${version}-${GITHUB_SHA::7}.apk" ;;
          esac
          cp "$built" "$RUNNER_TEMP/$name"
          echo "APK_PATH=$RUNNER_TEMP/$name" >> "$GITHUB_ENV"
          echo "APK_NAME=$name" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"

      - name: Upload the signed APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          label="qt-otp-mobile $VERSION_NAME (signed APK)"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes "$APK_PATH#$label"
