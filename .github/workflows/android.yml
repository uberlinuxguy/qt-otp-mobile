name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # compileSdk 37 with the versioned platform naming the SDK now uses.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Includes the vault interop tests, which are the compatibility contract
      # with the desktop qt-otp, so a break here should fail the build.
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      # R8 and the resource shrinker only run for the release variant, and this
      # app leans on reflection that R8 cannot see (kotlinx.serialization's
      # generated serializers, ML Kit's model loading). Building it here means a
      # proguard-rules mistake fails a pull request instead of a release. The
      # APK is unsigned - no secrets are needed, and none are available to fork
      # pull requests anyway - so it is checked, not published.
      - name: Build release APK (unsigned, R8 check)
        run: ./gradlew :app:assembleRelease

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: qt-otp-mobile-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
